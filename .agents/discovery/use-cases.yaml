# ia_plan: the nav file is site/astro.config.mjs (Starlight sidebar; groups are objects with label and items).
# First-steps entry and the everyday hub sit in different top-level groups (DOC-DISC-21).
# Longest nesting: group, page (2 levels). Group the top level: 5 groups for 18 pages (DOC-NAV-03).
ia_plan:
  base: /integrations/devcontainer/
  groups:
    - label: "Get started"
      tier: first-steps
      pages:
        - { path: site/src/content/docs/index.md,       doc_type: landing, doc_tier: first-steps, action: write, serves: [T01, T02] }
        - { path: site/src/content/docs/quickstart.md,  doc_type: how-to,  doc_tier: first-steps, action: write, serves: [T01] }
    - label: "Guides"
      tier: everyday
      pages:
        - { path: site/src/content/docs/guides/pin-or-upgrade-version.md,     doc_type: how-to, doc_tier: everyday, action: write, serves: [T03] }
        - { path: site/src/content/docs/guides/restore-toolchain.md,           doc_type: how-to, doc_tier: everyday, action: write, serves: [T04] }
        - { path: site/src/content/docs/guides/non-root-and-custom-users.md,   doc_type: how-to, doc_tier: everyday, action: write, serves: [T05] }
        - { path: site/src/content/docs/guides/minimal-images.md,              doc_type: how-to, doc_tier: everyday, action: write, serves: [T06] }
    - label: "Integrate"
      tier: integration
      pages:
        - { path: site/src/content/docs/integrate/proxy-and-custom-ca.md,        doc_type: how-to, doc_tier: integration, action: write, serves: [T07] }
        - { path: site/src/content/docs/integrate/mirror-and-air-gapped.md,      doc_type: how-to, doc_tier: integration, action: write, serves: [T08] }
        - { path: site/src/content/docs/integrate/managed-config.md,             doc_type: how-to, doc_tier: integration, action: write, serves: [T09] }
        - { path: site/src/content/docs/integrate/codespaces-and-prebuilds.md,   doc_type: how-to, doc_tier: integration, action: write, serves: [T10] }
    - label: "Concepts"
      pages:
        - { path: site/src/content/docs/concepts/how-the-install-works.md, doc_type: explanation, action: write, serves: [T14] }
    - label: "Troubleshooting"
      pages:
        - { path: site/src/content/docs/troubleshooting/install-errors.md,   doc_type: troubleshooting, action: write, serves: [T11] }
        - { path: site/src/content/docs/troubleshooting/container-errors.md, doc_type: troubleshooting, action: write, serves: [T11] }
    - label: "Reference"
      pages:
        - { path: site/src/content/docs/reference/options.md,               doc_type: reference, action: write, serves: [T12] }
        - { path: site/src/content/docs/reference/installer-parity.md,      doc_type: reference, action: write, serves: [T13] }
        - { path: site/src/content/docs/reference/environment-and-files.md, doc_type: reference, action: write, serves: [T12, T14] }
        - { path: site/src/content/docs/reference/supported-images.md,      doc_type: reference, action: write, serves: [T02, T06] }
        - { path: site/src/content/docs/changelog.md,                       doc_type: changelog, action: write, serves: [T03, T15] }
  outside_site:                 # shown by tooling, same user needs, separate files
    - { path: README.md,            doc_type: readme, action: write, serves: [T01, T02], note: "repo root; link the site (DOC-TYPE-34), license, who it is for" }
    - { path: src/ocx/NOTES.md,     doc_type: readme, action: write, serves: [T01, T02, T05, T06], note: "hand-written; appended to the generated README on containers.dev and in the VS Code picker" }
    - { path: src/ocx/README.md,    doc_type: readme, action: keep, serves: [T12], note: "generated by devcontainer features generate-docs; never hand-edit; option table cannot drift" }
  deletes: []
