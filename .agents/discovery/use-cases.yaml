# docs-plan artifact for the ocx Dev Container Feature.
# Location override: the skill default is docs/discovery/use-cases.yaml. This repo keeps
# discovery output under .agents/discovery/ (owner instruction), off the published surface;
# the page-declaration check excludes .agents by design.
# Human-readable page-by-page spec for the writer: writer-inventory.md (same directory).
# Friction logs: friction-logs/<task id>.md.

product_shape: cli          # assumption A1: the feature installs a CLI and ends at one printed value
signal: friction-log-severity
generated: 2026-11-17
# No pages exist yet (greenfield): inventory is empty, delete list is empty, every action is write.
# The declaration for product_shape must also be written into the docs config (site/ does not
# exist yet; planned carrier: site/docs.toml, key product_shape = "cli"). Not written here because
# this run may touch only .agents/discovery/.

surface_sources:            # never docs page titles
  - feature-option          # the 12 options of devcontainer-feature.json (planned)
  - lifecycle-hook          # the ocx pull hook
  - editor-extension        # ocx-sh.ocx
  - installer-variable      # OCX_INSTALL_* of www-setup/src/install.sh
  - installer-exit-code     # install.sh exit codes 0-7
  - readme-heading          # setup-ocx README sections (nearest sibling)
  - issue-title             # devcontainers/features issues cited in research/feature-implementation-survey.md
  - goal-file               # required use-case list in .agents/goals/ocx-feature.md
  # Issues and PRs in this repo: none exist yet (one merged adoption PR). Changelog: none. Search logs and telemetry: none.

# Surface completeness (DOC-DISC-08). Every option and entry point maps to a task or is out of scope.
entry_points:
  - { surface: "option version",          task: T03 }
  - { surface: "option distUrl",          task: T08 }
  - { surface: "option mirrorUrl",        task: T08 }
  - { surface: "option caBundle",         task: T07 }
  - { surface: "option libc",             task: T06 }
  - { surface: "option managedConfig",    task: T09 }
  - { surface: "option ocxHome",          task: T05 }
  - { surface: "option installDir",       task: T06 }
  - { surface: "option noUpdateCheck",    task: T10 }
  - { surface: "option consentPaths",     task: T04 }
  - { surface: "option pull",             task: T04 }
  - { surface: "option groups",           task: T04 }
  - { surface: "lifecycle hook (restore)", task: T04 }
  - { surface: "extension ocx-sh.ocx",    task: T04 }
  - { surface: "install.sh exit codes",   task: T11 }
  - { surface: "OCX_INSTALL_* variables", task: T13 }

out_of_scope:
  - { id: X01, surface: "ocx self setup, shell profile edits, completions", why: "the feature never runs ocx self setup at build; per-user shell wiring is the hook's job and is explained in T04, not a separate task" }
  - { id: X02, surface: "ocx self update inside the container", why: "an install under /usr/local/bin is not managed by self update; the supported upgrade is a new feature version (T03)" }
  - { id: X03, surface: "private registry credentials (OCX_AUTH_*)", why: "no credential option exists by design; the ocx docs own credential setup, T07 and T09 link there" }
  - { id: X04, surface: "checksum off-switch, OCX_NO_VERIFY, OCX_ALLOW_YANKED", why: "none exists; stated once in the parity page (T13)" }
  - { id: X05, surface: "writing ocx.toml and choosing tools", why: "ocx docs own project authoring; the quickstart shows only the minimum" }
  - { id: X06, surface: "Dockerfile COPY recipe for ocx without the feature", why: "superseded by the feature; remains in the ocx docs as a fallback for unsupported bases (announcement PR D)" }
  - { id: X07, surface: "Windows containers, macOS hosts as container OS, 32-bit, riscv, ppc64le, s390x", why: "ocx ships Linux x86_64 and aarch64 only for this surface; stated in supported-images" }
  - { id: X08, surface: "building, testing and releasing the feature (task run, task test:image, release workflow)", why: "contributor documentation, belongs in CONTRIBUTING and AGENTS.md, not the user site" }
  - { id: X09, surface: "devcontainer CLI, Dev Containers extension and Codespaces setup in general", why: "upstream documentation; pages link out" }

