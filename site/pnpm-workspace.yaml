allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@ocx-sh/theme@0.7.0'
# shortcut: pagefind held at the theme's tested version (ocx-site check C-070 and the deploy action abort on a mismatch); Starlight's ^1.5.2 resolves to 1.6.0. Drop when the released theme tests a newer Pagefind.
overrides:
  pagefind: 1.5.2
  '@pagefind/default-ui': 1.5.2
