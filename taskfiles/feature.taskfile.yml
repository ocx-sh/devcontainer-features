# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# The feature's lint and unit tests, included flat from the root taskfile.yml.
# Run as `ocx exec -g all -- task <name>`; CI reaches these through `task ci:lint` and `task ci:test`.
version: "3"

vars:
  UNIT_IMAGE: ocx-feature-unit
  # CI's lint job pulls default+lint and its test job default+test (the suite's tools live in the image).
  LINT_OCX: ocx exec -g default -g lint --
  TEST_OCX: ocx exec -g default --

tasks:
  lint:
    desc: ShellCheck (every finding fails), shfmt, and a check that every shellcheck disable carries a reason
    cmds:
      - cmd: "{{.LINT_OCX}} sh scripts/lint.sh"

  test:unit:image:
    desc: Build the interpreter image the unit suite runs in (cached by Docker)
    run: once
    cmds:
      - docker build -q -t {{.UNIT_IMAGE}} -f test/unit/Dockerfile test/unit

  test:unit:
    desc: "Unit suite on dash, busybox sh and bash --posix, then the coverage gate. Filter: FILE=test/unit/lib.bats, LEGS='dash' (newline list)"
    deps: [test:unit:image]
    vars:
      FILE: '{{.FILE | default "test/unit"}}'
      LEGS: '{{.LEGS | default ""}}'
    cmds:
      - "{{.TEST_OCX}} pnpm install --frozen-lockfile"
      - mkdir -p target/reports/junit
      - >-
        docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
        -e OCXF_FILE={{.FILE}} -e "OCXF_LEGS={{.LEGS}}"
        -v "$PWD:/work:ro" -v "$PWD/target/reports:/work/target/reports"
        -w /work {{.UNIT_IMAGE}} sh test/unit/run-legs.sh

  dist:check:
    desc: Compare the vendored release manifest with setup.ocx.sh; exit 10 when an update is available
    cmds:
      - cmd: "sh scripts/update-dist.sh --check"

  dist:update:
    desc: Refresh the vendored release manifest from setup.ocx.sh (guarded, additions only)
    cmds:
      - cmd: "sh scripts/update-dist.sh"

  parity:check:
    desc: Compare installer-parity.json with the live official installer
    cmds:
      - cmd: "sh scripts/check-installer-parity.sh"

  feature:readme:
    desc: Regenerate src/ocx/README.md from devcontainer-feature.json and NOTES.md (edit NOTES.md, never the README)
    cmds:
      - cmd: "{{.TEST_OCX}} pnpm install --frozen-lockfile"
      - cmd: "{{.TEST_OCX}} pnpm exec sh scripts/readme.sh"

  feature:readme:check:
    desc: Fail when the committed src/ocx/README.md is stale
    cmds:
      - cmd: "{{.TEST_OCX}} pnpm install --frozen-lockfile"
      - cmd: "{{.TEST_OCX}} pnpm exec sh scripts/readme.sh --check"

  release:rehearse:
    desc: Dry-run scripts/release/publish.sh with the real devcontainer CLI (packages the feature; no commit, push, tag or publish)
    cmds:
      - cmd: "{{.TEST_OCX}} pnpm install --frozen-lockfile"
      - cmd: >-
          {{.TEST_OCX}} pnpm exec env DRY_RUN=true OCX_VERSION=rehearsal DEFAULT_BRANCH=main REPO=ocx-sh/devcontainer-features
          FEATURE_VERSION="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' src/ocx/devcontainer-feature.json | head -n 1)"
          sh scripts/release/publish.sh
